<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lista de Largada · Balneário Run</title>
<style>
:root{--gold:#d4af37;--bg:#0a0d13;--card:#12161f;--line:#232a36;--text:#e6e6e6;--muted:#8891a0;}
*{box-sizing:border-box;}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2130 0%,#0a0d13 55%);font-family:'Helvetica Neue',Arial,sans-serif;color:var(--text);padding:28px 16px 60px;min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;text-align:center;}
.brand{font-size:15px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;font-weight:700;}
.brand span{color:#fff;}
.event{font-size:30px;font-weight:800;color:#fff;margin:10px 0 4px;}
.event .accent{color:var(--gold);}
.sub{font-size:12.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.card{margin-top:32px;background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:28px 22px;}
.card h2{margin:0 0 10px;font-size:20px;color:var(--gold);}
.card p{margin:0;font-size:15px;line-height:1.5;color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">022<span>RUNNERS</span></div>
  <div class="event">Balneário <span class="accent">Run</span></div>
  <div class="sub">18 de outubro de 2026 · São Pedro da Aldeia</div>
  <div class="card">
    <h2>Lista de largada em atualização</h2>
    <p>Estamos atualizando a lista de largada. Ela volta a ficar disponível aqui em breve.</p>
  </div>
</div>
</body>
</html>
